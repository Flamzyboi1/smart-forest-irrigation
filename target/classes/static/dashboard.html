<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Forest Monitoring Dashboard</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f2f6f3;color:#203128}.top{height:78px;background:#187247;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 34px}.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0 0;opacity:.85;font-size:12px}.nav{display:flex;gap:20px;align-items:center}.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:14px}.nav a:hover{text-decoration:underline}.user{font-size:13px;opacity:.95}.logout{background:#b7352c;color:white;border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.wrap{padding:18px 30px 26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{background:white;border-radius:12px;padding:15px 18px;box-shadow:0 2px 9px #183c2812;border-top:4px solid #1d7b4b}.stat .n{font-size:28px;font-weight:800;color:#187247}.stat .l{font-size:13px;color:#6a756e}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,1fr);gap:16px}.card{background:#fff;border-radius:13px;box-shadow:0 2px 9px #183c2812;overflow:hidden}.card h2{font-size:17px;margin:0;padding:15px 17px;border-bottom:1px solid #e6ece8;color:#17633f}.map{height:610px}.side{height:610px;overflow:auto;padding:0}.sensor{padding:14px 16px;border-left:5px solid #28a365;border-bottom:1px solid #edf1ee}.sensor.critical{border-left-color:#d13c32;background:#fff7f6}.sensor.high{border-left-color:#e28b21;background:#fffaf1}.sensor h3{margin:0 0 5px;font-size:15px}.sensor p{margin:3px 0;font-size:13px;color:#4f5b54}.badge{display:inline-block;border-radius:14px;padding:4px 9px;font-size:11px;font-weight:800;background:#d9f2e1;color:#17633f}.badge.high{background:#fff0cf;color:#8a5700}.badge.critical{background:#ffe0dc;color:#a51e17}.alert{margin:14px 16px;background:#fff3f2;border:1px solid #efc0bc;border-radius:9px;padding:11px;color:#8f251d;font-size:13px}.leaflet-tooltip.zone-label{background:#17633f;color:white;border:0;border-radius:5px;font-weight:800;padding:4px 7px}.legend{position:absolute;z-index:500;right:12px;bottom:12px;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 8px #0002;font-size:12px}.legend span{display:block;margin:3px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.low{background:#2aa65a}.med{background:#e4a126}.crit{background:#d33d33}@media(max-width:1000px){.nav{gap:8px}.user{display:none}.layout{grid-template-columns:1fr}.side{height:auto}.map{height:500px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand"><h1>🌲 Smart Forest Monitoring Dashboard</h1><p>Forest Fire & Environmental Monitoring System</p></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="zones.html">Zones</a><a href="sensors.html">Sensors</a><a href="alerts.html">Alerts</a><a href="user-management.html" id="userNav">Users</a><span class="user" id="currentUserName"></span><button class="logout" onclick="logout()">Logout</button></nav></header>
<main class="wrap"><div class="stats"><div class="stat"><div class="n" id="zonesN">-</div><div class="l">Forest Zones</div></div><div class="stat"><div class="n" id="sensorsN">-</div><div class="l">Active Sensors</div></div><div class="stat"><div class="n" id="alertsN">-</div><div class="l">Unresolved Alerts</div></div><div class="stat"><div class="n" id="criticalN">-</div><div class="l">Critical FRI ≥ 75</div></div></div><div class="layout"><section class="card" style="position:relative"><h2>Forest Monitoring Map</h2><div id="map" class="map"></div><div class="legend"><span><i class="dot low"></i>Low</span><span><i class="dot med"></i>Medium/High</span><span><i class="dot crit"></i>Critical</span></div></section><section class="card"><h2>Latest Sensor Status</h2><div class="side" id="sensorList">Loading...</div></section></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/app.js"></script><script>
setupNav('dashboard');const map=L.map('map').setView([57.1,24.6],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const layers=[];
function riskClass(f){return f>=75?'critical':f>=50?'high':'low'}function color(f){return f>=75?'#d33d33':f>=25?'#e4a126':'#2aa65a'}
async function load(){try{const [zs,ss,rs,as]=await Promise.all([api('/api/forest/zones'),api('/api/forest/sensors'),api('/api/forest/readings'),api('/api/forest/alerts/unresolved')]);zonesN.textContent=zs.length;sensorsN.textContent=ss.filter(s=>s.active).length;alertsN.textContent=as.length;criticalN.textContent=rs.filter(r=>r.fireRiskIndex>=75).length;layers.forEach(x=>map.removeLayer(x));layers.length=0;const bounds=[];zs.forEach(z=>{const c=color(z.fireRisk==='CRITICAL'?80:z.fireRisk==='HIGH'?60:z.fireRisk==='MEDIUM'?35:10);const circle=L.circle([z.centerLat,z.centerLng],{radius:z.radiusMeters||500,color:c,fillColor:c,fillOpacity:.18,weight:3}).addTo(map).bindTooltip(z.name,{permanent:true,direction:'top',className:'zone-label'}).bindPopup(`<b>${esc(z.name)}</b><br>Type: ${esc(z.treeSpecies)}<br>Area: ${z.areaHectares} ha<br>Fire risk: ${esc(z.fireRisk||'LOW')}`);layers.push(circle);bounds.push([z.centerLat,z.centerLng]);});ss.forEach(s=>{const r=rs.filter(x=>x.sensor&&x.sensor.id===s.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];const fri=r?r.fireRiskIndex:0;const m=L.circleMarker([s.latitude,s.longitude],{radius:8,color:'#fff',weight:2,fillColor:color(fri),fillOpacity:1}).addTo(map).bindPopup(`<b>${esc(s.locationLabel||s.sensorId)}</b><br>Sensor: ${esc(s.sensorId)}<br>FRI: ${fri}<br>Temperature: ${r?.temperature??'-'} °C<br>Humidity: ${r?.humidity??'-'} %<br>CO₂: ${r?.co2Level??'-'} ppm<br>Battery: ${r?.batteryVoltage??'-'} V`);layers.push(m);bounds.push([s.latitude,s.longitude]);});if(bounds.length)map.fitBounds(bounds,{padding:[35,35]});sensorList.innerHTML=ss.map(s=>{const r=rs.filter(x=>x.sensor&&x.sensor.id===s.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];const fri=r?.fireRiskIndex||0;const rc=riskClass(fri);return `<div class="sensor ${rc}"><span class="badge ${rc}">${fri>=75?'CRITICAL':fri>=50?'HIGH':fri>=25?'MONITOR':'LOW RISK'}</span><h3>${esc(s.locationLabel||s.sensorId)}</h3><p><b>Zone:</b> ${esc(s.zone?.name||'-')} · <b>Forest:</b> ${esc(s.zone?.treeSpecies||'-')}</p><p>🌡 ${r?.temperature??'-'} °C · 💧 ${r?.humidity??'-'}% · 💨 ${r?.windSpeed??'-'} km/h</p><p>🟠 CO₂ ${r?.co2Level??'-'} ppm · 🔋 ${r?.batteryVoltage??'-'} V · 🔥 <b>FRI ${fri}</b></p></div>`}).join('')||'<div style="padding:20px">No sensors found.</div>';}catch(e){sensorList.innerHTML='<div style="padding:20px;color:#a51e17">'+esc(e.message)+'</div>';}}load();
</script></body></html>
