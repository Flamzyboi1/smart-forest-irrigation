<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Forest — Zones</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f2f6f3;color:#203128}.top{height:74px;background:#187247;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0;font-size:12px;opacity:.8}.nav{display:flex;gap:18px;align-items:center}.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:13px}.logout,.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.logout{background:#b7352c;color:#fff}.wrap{padding:25px 30px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.bar h2{color:#17633f}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 9px #183c2812}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eeea;font-size:14px}th{background:#f6f9f7;color:#5d6962}.primary{background:#187247;color:#fff}.danger{background:#c9342e;color:#fff}.secondary{background:#66736b;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0006;place-items:center;z-index:10}.modal.open{display:grid}.box{background:#fff;width:min(500px,92vw);padding:24px;border-radius:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #ccd5cf;border-radius:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:800px){.nav a{display:none}}
</style></head><body><header class="top"><div class="brand"><h1>🌲 Smart Forest Monitoring</h1><p>Forest Fire & Environmental Monitoring System</p></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="zones.html">Zones</a><a href="sensors.html">Sensors</a><a href="alerts.html">Alerts</a><a href="user-management.html" id="userNav">Users</a><span id="currentUserName"></span><button class="logout" onclick="logout()">Logout</button></nav></header><main class="wrap"><div class="bar"><h2>Forest Zones</h2><button id="addBtn" class="btn primary" onclick="openModal()">+ Add Zone</button></div><div class="card"><table><thead><tr><th>Name</th><th>Forest Type</th><th>Area</th><th>Coordinates</th><th>Fire Risk</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main><div class="modal" id="modal"><div class="box"><h3 id="mt">Add Forest Zone</h3><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Forest Type</label><input id="species" placeholder="Pine, Mixed, Oak"></div><div class="field"><label>Area (hectares)</label><input id="area" type="number" step="0.1"></div><div class="field"><label>Latitude</label><input id="lat" type="number" step="0.0001"></div><div class="field"><label>Longitude</label><input id="lng" type="number" step="0.0001"></div><div class="field"><label>Radius (m)</label><input id="radius" type="number"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="save()">Save</button></div></div></div><script src="/js/app.js"></script><script>setupNav('zones');let zones=[],editId=null;const canEdit=['ADMIN','SUPERADMIN'].includes(role());const canDelete=role()==='SUPERADMIN';if(!canEdit)addBtn.style.display='none';function openModal(id){editId=id||null;const z=zones.find(x=>x.id===id);mt.textContent=id?'Edit Forest Zone':'Add Forest Zone';name.value=z?.name||'';species.value=z?.treeSpecies||'';area.value=z?.areaHectares||'';lat.value=z?.centerLat||'';lng.value=z?.centerLng||'';radius.value=z?.radiusMeters||500;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function load(){zones=await api('/api/forest/zones');rows.innerHTML=zones.map(z=>`<tr><td><b>${esc(z.name)}</b></td><td>${esc(z.treeSpecies)}</td><td>${z.areaHectares} ha</td><td>${z.centerLat}, ${z.centerLng}</td><td>${esc(z.fireRisk||'LOW')}</td><td>${canEdit?`<button class="btn secondary" onclick="openModal(${z.id})">Edit</button>`:''} ${canDelete?`<button class="btn danger" onclick="del(${z.id})">Delete</button>`:''}</td></tr>`).join('')}async function save(){const body={name:name.value.trim(),treeSpecies:species.value.trim(),areaHectares:+area.value,centerLat:+lat.value,centerLng:+lng.value,radiusMeters:+radius.value,fireRisk:'LOW',healthStatus:'HEALTHY',status:'NORMAL',treeAgeYears:0};try{await api(editId?`/api/forest/zones/${editId}`:'/api/forest/zones',{method:editId?'PUT':'POST',body:JSON.stringify(body)});closeModal();load()}catch(e){alert(e.message)}}async function del(id){if(confirm('Delete this zone?')){try{await api('/api/forest/zones/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}load();</script></body></html>
