<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoIGM Login</title><style>body{font-family:Arial;background:#f3f7f1;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:32px;border-radius:14px;width:min(420px,92vw);box-shadow:0 4px 20px #0001}input,button{width:100%;padding:12px;margin-top:8px}button{background:#0d6b45;color:#fff;border:0;border-radius:6px;font-weight:bold}.error{color:#a12626;margin-top:12px}</style></head><body><form id="login" class="card"><h1>EcoIGM</h1><p>Sign in to Smart Forest</p><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><div id="msg" class="error"></div></form><script>const norm=v=>{let r=String(v??'').toUpperCase().replace(/^ROLE_/,'').replace(/[- ]/g,'_');return r==='SUPER_ADMIN'||r==='SUPERADMIN'||r==='ADMIN'?'SUPERADMIN':r==='USER'?'OPERATOR':r};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Login failed');const u=d.user||d.account||d;const role=norm(u.role||u.authority||u.roles?.[0]||d.role||d.authority||d.roles?.[0]);localStorage.clear();localStorage.setItem('forestToken',d.token||d.accessToken||d.jwt||d.access_token||'');localStorage.setItem('forestUser',u.username||u.userName||u.login||d.username||f.username);localStorage.setItem('forestFullName',u.fullName||u.name||d.fullName||f.username);localStorage.setItem('forestRole',role);location.href='/dashboard.html?v=rolefix'}catch(err){document.getElementById('msg').textContent=err.message}};</script></body></html>
