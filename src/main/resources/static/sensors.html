<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensors</title><style>body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 14px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select{padding:9px;border:1px solid #ccd8ce;border-radius:5px;width:100%;box-sizing:border-box}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px;cursor:pointer;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Sensors</p></header><main class="wrap"><div class="panel"><button onclick="sensorForm.hidden=!sensorForm.hidden">+ Add Sensor</button><form id="sensorForm" hidden><div class="grid"><input name="name" placeholder="Sensor name" required><input name="type" placeholder="Sensor type"><input name="fieldName" placeholder="Forest block"><input name="zoneName" placeholder="Zone"><select name="status"><option>ACTIVE</option><option>OFFLINE</option></select></div><button>Save Sensor</button></form></div><section class="panel"><h2>Sensors</h2><table><thead><tr><th>Name</th><th>Type</th><th>Forest Block</th><th>Zone</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const fallback=[{name:'Northern Pine Sensor',type:'Weather',fieldName:'North Block',zoneName:'Northern Pine Forest',status:'ACTIVE'},{name:'Eastern Mixed Sensor',type:'Fire Risk',fieldName:'East Block',zoneName:'Eastern Mixed Forest',status:'CRITICAL'},{name:'Southern Oak Sensor',type:'Soil',fieldName:'South Block',zoneName:'Southern Oak Reserve',status:'ACTIVE'}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=fallback;try{const r=await fetch('/api/sensors');const d=await r.json();const x=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);if(x.length)a=x}catch{}rows.innerHTML=a.map(s=>`<tr><td>${esc(s.name||s.sensorName)}</td><td>${esc(s.type||s.sensorType)}</td><td>${esc(s.fieldName||s.fieldBlockName)}</td><td>${esc(s.zoneName||s.zone)}</td><td>${esc(s.status)}</td></tr>`).join('')}load();sensorForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/sensors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(sensorForm)))}).catch(()=>{});sensorForm.reset();sensorForm.hidden=true;load()}</script></body></html>
