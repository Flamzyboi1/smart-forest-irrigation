<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alerts</title><style>body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px #0001}input,select{padding:9px;margin:5px;border:1px solid #ccd8ce;border-radius:5px}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Alerts</p></header><main class="wrap"><section class="panel"><button onclick="alertForm.hidden=!alertForm.hidden">+ Add Alert</button><form id="alertForm" hidden><input name="title" placeholder="Alert title" required><input name="zoneName" placeholder="Zone"><input name="message" placeholder="Message"><select name="severity"><option>CRITICAL</option><option>WARNING</option><option>INFO</option></select><button>Save Alert</button></form><table><thead><tr><th>Alert</th><th>Zone</th><th>Message</th><th>Severity</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const fallback=[{title:'High fire risk detected',zoneName:'Eastern Mixed Forest',message:'FRI exceeded safe threshold',severity:'CRITICAL',status:'OPEN',createdAt:'2026-08-21 18:00'},{title:'Dry conditions',zoneName:'Northern Pine Forest',message:'Humidity below threshold',severity:'WARNING',status:'OPEN',createdAt:'2026-08-21 17:30'}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=fallback;try{const r=await fetch('/api/alerts');const d=await r.json();const x=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);if(x.length)a=x}catch{}rows.innerHTML=a.map(x=>`<tr><td>${esc(x.title||x.name)}</td><td>${esc(x.zoneName||x.zone)}</td><td>${esc(x.message||x.description)}</td><td>${esc(x.severity||x.level)}</td><td>${esc(x.status||x.state)}</td><td>${esc(x.createdAt||x.timestamp)}</td></tr>`).join('')}load();alertForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/alerts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(alertForm)))}).catch(()=>{});alertForm.reset();alertForm.hidden=true;load()}</script></body></html>
