<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readings</title><style>.site-nav{position:sticky;top:0;z-index:1000;background:#123f2c;padding:10px 3%;display:flex;gap:22px}.site-nav a{color:#fff;text-decoration:none;font-weight:bold}.site-nav a.active{color:#a9e7bd;border-bottom:2px solid #a9e7bd}body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px #0001}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}input,select{padding:10px;border:1px solid #ccd8ce;border-radius:5px;box-sizing:border-box;width:100%}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px;cursor:pointer}button.secondary{background:#6b7280}.message{margin-top:10px}.error{color:#991b1b}.success{color:#176b45}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Readings</p></header><main class="wrap"><section class="panel"><button id="addReading" type="button">+ Add Reading</button><form id="readingForm" class="form" hidden><input name="sensorName" placeholder="Sensor" required><input name="zoneName" placeholder="Zone" required><input name="value" type="number" step="any" placeholder="Value" required><input name="unit" placeholder="Unit" required><input name="recordedAt" type="datetime-local" required><span><button type="submit">Save Reading</button> <button id="cancelReading" class="secondary" type="button">Cancel</button></span></form><div id="message" class="message"></div><table><thead><tr><th>Sensor</th><th>Zone</th><th>Reading</th><th>Unit</th><th>Recorded</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/js/nav.js"></script><script src="/js/page-data.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('readingForm'),msg=document.getElementById('message');document.getElementById('addReading').addEventListener('click',()=>{form.hidden=false;form.querySelector('input').focus()});document.getElementById('cancelReading').addEventListener('click',()=>{form.reset();form.hidden=true;msg.textContent=''});form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/readings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Request failed');msg.className='message success';msg.textContent='Reading saved';form.reset();form.hidden=true;if(window.loadReadings)window.loadReadings()}catch{x=[];msg.className='message error';msg.textContent='Reading could not be saved locally or by the server'}})})</script></body></html>
