<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Forest — Alerts</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f2f6f3;color:#203128}.top{height:74px;background:#187247;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0;font-size:12px;opacity:.8}.nav{display:flex;gap:18px;align-items:center}.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:13px}.logout,.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.logout{background:#b7352c;color:#fff}.wrap{padding:25px 30px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.bar h2{color:#17633f}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 9px #183c2812}.alert{padding:15px;border-radius:9px;margin-bottom:10px;border-left:5px solid #d13c32;background:#fff5f4}.alert.res{border-left-color:#28a365;background:#f1fbf5}.meta{font-size:12px;color:#65716a;margin-top:5px}.btn{color:#fff}.success{background:#20834e}.danger{background:#c9342e}.actions{float:right;display:flex;gap:7px}.empty{text-align:center;padding:45px;color:#89938d}@media(max-width:800px){.nav a{display:none}}
</style></head><body><header class="top"><div class="brand"><h1>🌲 Smart Forest Monitoring</h1><p>Forest Fire & Environmental Monitoring System</p></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="zones.html">Zones</a><a href="sensors.html">Sensors</a><a href="alerts.html">Alerts</a><a href="user-management.html" id="userNav">Users</a><span id="currentUserName"></span><button class="logout" onclick="logout()">Logout</button></nav></header><main class="wrap"><div class="bar"><h2>Alerts</h2></div><div class="card" id="list">Loading...</div></main><script src="/js/app.js"></script><script>setupNav('alerts');async function load(){const as=await api('/api/forest/alerts');if(!as.length){list.innerHTML='<div class="empty">No alerts.</div>';return}list.innerHTML=as.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(a=>`<div class="alert ${a.acknowledged?'res':''}"><div class="actions">${!a.acknowledged&&['ADMIN','SUPERADMIN'].includes(role())?`<button class="btn success" onclick="resolve(${a.id})">Resolve</button>`:''}${role()==='SUPERADMIN'?`<button class="btn danger" onclick="del(${a.id})">Delete</button>`:''}</div><b>${a.acknowledged?'RESOLVED':'ACTIVE'} · ${esc(a.severity||'')}</b><div>${esc(a.message)}</div><div class="meta">${esc(a.zone?.name||'Unknown zone')} · ${esc(a.sensor?.locationLabel||a.sensor?.sensorId||'Unknown sensor')} · ${new Date(a.timestamp).toLocaleString()}</div></div>`).join('')}async function resolve(id){await api('/api/forest/alerts/'+id+'/resolve',{method:'PUT'});load()}async function del(id){if(confirm('Delete this alert?')){await api('/api/forest/alerts/'+id,{method:'DELETE'});load()}}load();</script></body></html>
