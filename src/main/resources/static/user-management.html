<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><style>body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px #0001}input,select{padding:9px;margin:5px;border:1px solid #ccd8ce;border-radius:5px}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Users</p></header><main class="wrap"><section class="panel"><button onclick="userForm.hidden=!userForm.hidden">+ Add User</button><form id="userForm" hidden><input name="fullName" placeholder="Full name" required><input name="username" placeholder="Username" required><input name="email" placeholder="Email"><select name="role"><option>FARMER</option><option>ADMIN</option><option>SUPERADMIN</option></select><select name="status"><option>ACTIVE</option><option>DISABLED</option></select><button>Save User</button></form><h2>All Users</h2><table><thead><tr><th>Full Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const fallback=[{fullName:'Forest Administrator',username:'admin',email:'admin@smartforest.local',role:'SUPERADMIN',status:'ACTIVE'},{fullName:'Anna Forest',username:'anna',email:'anna@smartforest.local',role:'ADMIN',status:'ACTIVE'},{fullName:'Jānis Ozols',username:'janis',email:'janis@smartforest.local',role:'FARMER',status:'ACTIVE'}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=fallback;try{const r=await fetch('/api/users');const d=await r.json();const x=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);if(x.length)a=x}catch{}rows.innerHTML=a.map(u=>`<tr><td>${esc(u.fullName||u.name)}</td><td>${esc(u.username||u.userName)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.status||u.enabled)}</td></tr>`).join('')}load();userForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(userForm)))}).catch(()=>{});userForm.reset();userForm.hidden=true;load()}</script></body></html>
