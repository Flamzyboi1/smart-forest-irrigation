<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Forest — Readings</title>
  <style>
    :root { --green:#176b45; --dark:#123f2c; --bg:#f4f8f5; --line:#dce8df; --muted:#64748b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:#24352c; }
    .top { background:var(--dark); color:#fff; padding:14px 4%; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
    .brand { font-weight:700; font-size:18px; }
    nav { display:flex; gap:16px; flex-wrap:wrap; }
    nav a { color:#e4f6e9; text-decoration:none; font-weight:600; }
    nav a.active { color:#fff; border-bottom:2px solid #a9e7bd; padding-bottom:3px; }
    .hero { background:var(--green); color:#fff; padding:25px 4%; }
    .hero h1 { margin:0 0 6px; font-size:28px; }
    .hero p { margin:0; opacity:.9; }
    main { padding:24px 4%; max-width:1400px; margin:auto; }
    .toolbar, .panel { background:#fff; border-radius:12px; box-shadow:0 2px 14px #00000012; }
    .toolbar { padding:15px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px; }
    .panel { padding:20px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    button { border:0; border-radius:6px; background:var(--green); color:#fff; padding:10px 14px; cursor:pointer; font-weight:600; }
    button.secondary { background:#64748b; }
    button:hover { filter:brightness(.94); }
    .status { color:var(--muted); font-size:14px; }
    .status.error { color:#b42318; }
    .status.success { color:var(--green); }
    form { display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:10px; margin:18px 0; padding:16px; background:#f8fbf8; border:1px solid var(--line); border-radius:9px; }
    input { width:100%; border:1px solid #cbd8cf; border-radius:6px; padding:10px; background:#fff; }
    .form-actions { display:flex; gap:8px; align-items:center; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:720px; }
    th, td { text-align:left; padding:12px; border-bottom:1px solid var(--line); }
    th { background:#eaf4ed; color:#17432d; font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
    td.value { font-weight:700; }
    .empty { padding:40px; text-align:center; color:var(--muted); }
    @media (max-width:850px) { form { grid-template-columns:repeat(2,minmax(0,1fr)); } .form-actions { grid-column:1/-1; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">🌲 Smart Forest Monitoring</div>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/zones.html">Zones</a>
      <a href="/sensors.html">Sensors</a>
      <a class="active" href="/readings.html">Readings</a>
      <a href="/alerts.html">Alerts</a>
      <a href="/user-management.html">Users</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Sensor Readings</h1>
    <p>Live measurements linked to forest sensors and zones.</p>
  </section>
  <main>
    <section class="toolbar">
      <div>
        <strong>Environmental readings</strong>
        <div id="status" class="status">Loading readings…</div>
      </div>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
        <button id="toggle-form" type="button">+ Add Reading</button>
      </div>
    </section>
    <section class="panel">
      <form id="reading-form" hidden>
        <input name="sensorName" placeholder="Sensor name" required>
        <input name="zoneName" placeholder="Zone name" required>
        <input name="value" type="number" step="any" placeholder="Value" required>
        <input name="unit" placeholder="Unit (e.g. °C, %, ppm)" required>
        <input name="recordedAt" type="datetime-local" required>
        <div class="form-actions">
          <button type="submit">Save Reading</button>
          <button id="cancel-form" class="secondary" type="button">Cancel</button>
        </div>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Sensor</th><th>Zone</th><th>Value</th><th>Unit</th><th>Recorded</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>No readings are available yet.</div>
    </section>
  </main>
  <script>
    (() => {
      const fallback = [
        { sensorName:'Northern Pine Sensor', zoneName:'Northern Pine Forest', value:24.5, unit:'°C', recordedAt:'2026-08-21 18:00' },
        { sensorName:'Eastern Mixed Sensor', zoneName:'Eastern Mixed Forest', value:31.2, unit:'°C', recordedAt:'2026-08-21 18:00' },
        { sensorName:'Southern Oak Sensor', zoneName:'Southern Oak Reserve', value:42, unit:'%', recordedAt:'2026-08-21 18:00' }
      ];
      const $ = id => document.getElementById(id);
      const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const token = () => localStorage.getItem('forestToken') || localStorage.getItem('token') || '';
      const headers = extra => ({ ...extra, ...(token() ? { Authorization:'Bearer ' + token() } : {}) });
      const normalize = data => {
        const values = Array.isArray(data) ? data : (data && data._embedded ? Object.values(data._embedded).find(Array.isArray) || [] : []);
        return values.map(item => ({
          sensorName: item.sensorName || item.sensor?.name || item.sensor?.sensorName || item.sensor?.locationLabel || item.sensor || 'Unknown sensor',
          zoneName: item.zoneName || item.zone?.name || item.zone?.zoneName || item.zone || 'Unassigned zone',
          value: item.value ?? item.reading ?? item.measurement ?? item.temperature ?? item.moisture ?? '-',
          unit: item.unit || item.measurementUnit || '',
          recordedAt: item.recordedAt || item.timestamp || item.createdAt || item.measuredAt || '-'
        }));
      };
      function render(readings) {
        $('rows').innerHTML = readings.map(row => `<tr><td>${esc(row.sensorName)}</td><td>${esc(row.zoneName)}</td><td class="value">${esc(row.value)}</td><td>${esc(row.unit)}</td><td>${esc(row.recordedAt)}</td></tr>`).join('');
        $('empty').hidden = readings.length > 0;
      }
      async function load() {
        $('status').className = 'status';
        $('status').textContent = 'Loading readings…';
        try {
          const response = await fetch('/api/readings', { headers: headers({ Accept:'application/json' }) });
          if (!response.ok) throw new Error('API returned ' + response.status);
          const readings = normalize(await response.json());
          render(readings.length ? readings : fallback);
          $('status').textContent = readings.length ? `${readings.length} live reading(s) loaded.` : 'No API readings yet — showing sample forest data.';
        } catch (error) {
          render(fallback);
          $('status').className = 'status error';
          $('status').textContent = 'Readings API is unavailable — showing sample forest data.';
        }
      }
      $('toggle-form').addEventListener('click', () => {
        $('reading-form').hidden = !$('reading-form').hidden;
        if (!$('reading-form').hidden) $('reading-form').elements.sensorName.focus();
      });
      $('cancel-form').addEventListener('click', () => {
        $('reading-form').reset();
        $('reading-form').hidden = true;
      });
      $('refresh').addEventListener('click', load);
      $('reading-form').addEventListener('submit', async event => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.currentTarget));
        try {
          const response = await fetch('/api/readings', {
            method:'POST',
            headers:headers({ 'Content-Type':'application/json', Accept:'application/json' }),
            body:JSON.stringify(payload)
          });
          if (!response.ok) throw new Error('Save failed');
          $('status').className = 'status success';
          $('status').textContent = 'Reading saved successfully.';
          event.currentTarget.reset();
          event.currentTarget.hidden = true;
          load();
        } catch (error) {
          $('status').className = 'status error';
          $('status').textContent = 'Could not save the reading. Check your login and API configuration.';
        }
      });
      load();
    })();
  </script>
</body>
</html>
