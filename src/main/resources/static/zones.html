<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zones</title><style>body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 14px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select{padding:9px;border:1px solid #ccd8ce;border-radius:5px;box-sizing:border-box;width:100%}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px;cursor:pointer;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Zones</p></header><main class="wrap"><div class="panel"><button onclick="document.getElementById('zoneForm').hidden=!document.getElementById('zoneForm').hidden">+ Add Zone</button><form id="zoneForm" hidden><div class="grid"><input name="name" placeholder="Zone name" required><input name="fieldName" placeholder="Forest block"><input name="forestType" placeholder="Forest type"><input name="threshold" placeholder="Moisture threshold"><select name="status"><option>ACTIVE</option><option>INACTIVE</option></select></div><button>Save Zone</button></form></div><section class="panel"><h2>Zones</h2><table><thead><tr><th>Zone</th><th>Forest Block</th><th>Forest Type</th><th>Threshold</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const fallback=[{name:'Northern Pine Forest',fieldName:'North Block',forestType:'Pine',threshold:45,status:'ACTIVE'},{name:'Eastern Mixed Forest',fieldName:'East Block',forestType:'Mixed',threshold:35,status:'ACTIVE'},{name:'Southern Oak Reserve',fieldName:'South Block',forestType:'Oak',threshold:40,status:'ACTIVE'}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=fallback;try{const r=await fetch('/api/zones');const d=await r.json();const x=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);if(x.length)a=x}catch{}rows.innerHTML=a.map(z=>`<tr><td>${esc(z.name||z.zoneName)}</td><td>${esc(z.fieldName||z.fieldBlockName)}</td><td>${esc(z.forestType||z.plantType)}</td><td>${esc(z.threshold||z.moistureThreshold)}</td><td>${esc(z.status)}</td></tr>`).join('')}load();zoneForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/zones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(zoneForm)))}).catch(()=>{});zoneForm.reset();zoneForm.hidden=true;load()}</script></body></html>
