<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Forest — Sensors</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f2f6f3;color:#203128}.top{height:74px;background:#187247;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0;font-size:12px;opacity:.8}.nav{display:flex;gap:18px;align-items:center}.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:13px}.logout,.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.logout{background:#b7352c;color:#fff}.wrap{padding:25px 30px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.bar h2{color:#17633f}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 9px #183c2812}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eeea;font-size:14px}th{background:#f6f9f7}.primary{background:#187247;color:#fff}.danger{background:#c9342e;color:#fff}.secondary{background:#66736b;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0006;place-items:center}.modal.open{display:grid}.box{background:#fff;width:min(470px,92vw);padding:24px;border-radius:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd5cf;border-radius:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:800px){.nav a{display:none}}
</style></head><body><header class="top"><div class="brand"><h1>🌲 Smart Forest Monitoring</h1><p>Forest Fire & Environmental Monitoring System</p></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="zones.html">Zones</a><a href="sensors.html">Sensors</a><a href="alerts.html">Alerts</a><a href="user-management.html" id="userNav">Users</a><span id="currentUserName"></span><button class="logout" onclick="logout()">Logout</button></nav></header><main class="wrap"><div class="bar"><h2>Forest Sensors</h2><button id="addBtn" class="btn primary" onclick="openModal()">+ Add Sensor</button></div><div class="card"><table><thead><tr><th>Sensor</th><th>Type</th><th>Zone</th><th>Status</th><th>Latest FRI</th><th>Temperature</th><th>Humidity</th><th>CO₂</th><th>Battery</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main><div class="modal" id="modal"><div class="box"><h3>Add Sensor</h3><div class="field"><label>Sensor ID</label><input id="sid" placeholder="FR-NEW-001"></div><div class="field"><label>Type</label><input id="type" value="Multi-Environmental"></div><div class="field"><label>Location Label</label><input id="label" placeholder="North Forest Sensor"></div><div class="field"><label>Latitude</label><input id="lat" type="number" step="0.0001"></div><div class="field"><label>Longitude</label><input id="lng" type="number" step="0.0001"></div><div class="field"><label>Zone</label><select id="zone"></select></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="save()">Save</button></div></div></div><script src="/js/app.js"></script><script>setupNav('sensors');let zones=[],sensors=[],readings=[];const canEdit=['ADMIN','SUPERADMIN'].includes(role()),canDelete=role()==='SUPERADMIN';if(!canEdit)addBtn.style.display='none';async function load(){[sensors,readings,zones]=await Promise.all([api('/api/forest/sensors'),api('/api/forest/readings'),api('/api/forest/zones')]);rows.innerHTML=sensors.map(s=>{const r=readings.filter(x=>x.sensor?.id===s.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];return `<tr><td><b>${esc(s.locationLabel||s.sensorId)}</b><br><small>${esc(s.sensorId)}</small></td><td>${esc(s.type)}</td><td>${esc(s.zone?.name||'-')}</td><td>${s.active?'Online':'Offline'}</td><td>${r?.fireRiskIndex??'-'}</td><td>${r?.temperature??'-'} °C</td><td>${r?.humidity??'-'}%</td><td>${r?.co2Level??'-'} ppm</td><td>${r?.batteryVoltage??'-'} V</td><td>${canDelete?`<button class="btn danger" onclick="del(${s.id})">Delete</button>`:''}</td></tr>`}).join('');}function openModal(){zone.innerHTML=zones.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join('');modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function save(){const z=zones.find(x=>x.id==zone.value);try{await api('/api/forest/sensors',{method:'POST',body:JSON.stringify({sensorId:sid.value.trim(),type:type.value.trim(),locationLabel:label.value.trim(),latitude:+lat.value,longitude:+lng.value,active:true,zone:z})});closeModal();load()}catch(e){alert(e.message)}}async function del(id){if(confirm('Delete this sensor?')){try{await api('/api/forest/sensors/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}load();</script></body></html>
