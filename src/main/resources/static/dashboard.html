<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Smart Forest Monitoring</title><style>body{margin:0;font-family:Arial;background:#eef5ef;color:#21352a}header{background:#176b45;color:#fff;padding:24px 4%}main{padding:24px 4%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 12px #0001}.map{height:360px;margin-top:15px;border-radius:12px;background:linear-gradient(135deg,#b9d9ad,#5e925f);position:relative;overflow:hidden}.marker{position:absolute;background:#176b45;color:#fff;border:3px solid #fff;border-radius:50%;padding:13px 9px;font-size:12px;font-weight:bold;cursor:grab}.m1{left:18%;top:25%}.m2{left:58%;top:18%}.m3{left:43%;top:65%}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><script src="/js/nav.js"></script></head><body><header><h1>Smart Forest Monitoring</h1><p>Dashboard</p></header><main><div class="grid"><div class="card"><h2>Forest Zones</h2><p>3 monitored zones</p></div><div class="card"><h2>Active Sensors</h2><p>3 sensors online</p></div><div class="card"><h2>System Status</h2><p>All systems operational</p></div></div><section class="card" style="margin-top:18px"><h2>Forest Map</h2><div class="map"><div class="marker m1">Northern Pine</div><div class="marker m2">Eastern Mixed</div><div class="marker m3">Southern Oak</div></div></section></main><script>document.querySelectorAll('.marker').forEach(el=>{let d=false,x=0,y=0;el.onpointerdown=e=>{d=true;x=e.clientX-el.offsetLeft;y=e.clientY-el.offsetTop;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(d){el.style.left=e.clientX-x+'px';el.style.top=e.clientY-y+'px'}};el.onpointerup=()=>d=false})</script></body></html>
