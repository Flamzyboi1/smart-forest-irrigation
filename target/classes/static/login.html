<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Forest Monitoring — Login</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#123524,#1f6b43,#0d2b1c);display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 70px #0005}.brand{text-align:center;margin-bottom:28px}.brand .icon{font-size:44px}.brand h1{margin:8px 0 4px;color:#174b31;font-size:28px}.brand p{margin:0;color:#68736d}.field{margin:18px 0}.field label{display:block;font-weight:700;color:#24332a;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #ccd5cf;border-radius:9px;font-size:15px}.field input:focus{outline:2px solid #8bc6a3;border-color:#2e7d4d}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:#267447;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.error{display:none;background:#fff0f0;border:1px solid #efb1b1;color:#9f1d1d;padding:11px;border-radius:8px;margin-bottom:15px}.hint{margin-top:20px;background:#f3f8f4;padding:12px;border-radius:8px;font-size:13px;color:#4e5b53}.hint b{color:#174b31}</style></head><body>
<div class="box"><div class="brand"><div class="icon">🌲</div><h1>Smart Forest Monitoring</h1><p>Forest Fire & Environmental Monitoring System</p></div><div id="error" class="error"></div><form id="form"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">Sign In</button></form><div class="hint"><b>Demo accounts</b><br>Super Admin: ForestAdmin / Forest123#<br>Admin: ranger1 / Ranger123#<br>User: observer1 / Observer123#</div></div>
<script src="/js/app.js"></script><script>
(async()=>{if(localStorage.getItem('forestToken')){try{await api('/api/users/me');location.href='/dashboard.html';}catch{}}})();
form.addEventListener('submit',async e=>{e.preventDefault();const btn=submit,err=error;btn.disabled=true;btn.textContent='Signing in...';err.style.display='none';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Invalid login');localStorage.setItem('forestToken',d.token);localStorage.setItem('forestUser',d.username);localStorage.setItem('forestFullName',d.fullName);localStorage.setItem('forestRole',d.role);localStorage.setItem('forestEmail',d.email);location.href='/dashboard.html';}catch(x){err.textContent=x.message;err.style.display='block';}finally{btn.disabled=false;btn.textContent='Sign In';}});
</script></body></html>
