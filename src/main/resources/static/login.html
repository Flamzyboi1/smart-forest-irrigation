<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login</title><style>body{font-family:Arial;background:#eaf4ed;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:12px;width:min(360px,90%)}input,button{width:100%;padding:11px;margin:7px 0;box-sizing:border-box}button{background:#176b45;color:white;border:0;border-radius:5px}</style></head><body><form class="box" id="loginForm"><h1>Smart Forest Monitoring</h1><input id="username" required placeholder="Username"><input id="password" required type="password" placeholder="Password"><button>Sign in</button><p id="error"></p></form><script src="/js/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});localStorage.setItem('forestToken',r.token||'');localStorage.setItem('forestUser',username.value);location.href='/dashboard.html'}catch(x){error.textContent=x.message}})</script></body></html>
