<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart Forest Monitoring</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef5ef;color:#21352a}header{background:#176b45;color:#fff;padding:24px 4%}main{padding:24px 4%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 12px #0001}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde7df;text-align:left}th{background:#176b45;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Smart Forest Monitoring</h1><p>Dashboard</p></header><main><div class="grid"><section class="card"><h2>Forest Zones</h2><p>3 monitored zones</p></section><section class="card"><h2>Active Sensors</h2><p>3 sensors online</p></section><section class="card"><h2>System Status</h2><p>All systems operational</p></section></div><section class="card" style="margin-top:18px"><h2>Recent Readings</h2><table><thead><tr><th>Sensor</th><th>Value</th><th>Unit</th><th>Time</th></tr></thead><tbody><tr><td>Northern Pine Sensor</td><td>24.5</td><td>°C</td><td>18:00</td></tr><tr><td>Eastern Mixed Sensor</td><td>61</td><td>%</td><td>18:00</td></tr><tr><td>Southern Oak Sensor</td><td>42</td><td>%</td><td>18:00</td></tr></tbody></table></section></main><script src="/js/app.js"></script><script src="/js/lang.js"></script></body></html>
