<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readings</title><style>body{margin:0;font-family:Arial;background:#f4f8f5;color:#24352c}.header{background:#176b45;color:#fff;padding:18px 3%}.wrap{padding:20px 3%}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px #0001}input{padding:9px;margin:5px;border:1px solid #ccd8ce;border-radius:5px}button{background:#176b45;color:#fff;border:0;border-radius:5px;padding:10px 15px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #e3ebe5;text-align:left}th{background:#176b45;color:#fff}</style></head><body><header class="header"><h1>Smart Forest Monitoring</h1><p>Readings</p></header><main class="wrap"><section class="panel"><button onclick="readingForm.hidden=!readingForm.hidden">+ Add Reading</button><form id="readingForm" hidden><input name="sensorName" placeholder="Sensor"><input name="zoneName" placeholder="Zone"><input name="value" placeholder="Value" required><input name="unit" placeholder="Unit"><button>Save Reading</button></form><table><thead><tr><th>Sensor</th><th>Zone</th><th>Reading</th><th>Unit</th><th>Recorded</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const fallback=[{sensorName:'Northern Pine Sensor',zoneName:'Northern Pine Forest',value:24.5,unit:'°C',recordedAt:'2026-08-21 18:00'},{sensorName:'Eastern Mixed Sensor',zoneName:'Eastern Mixed Forest',value:31.2,unit:'°C',recordedAt:'2026-08-21 18:00'},{sensorName:'Southern Oak Sensor',zoneName:'Southern Oak Reserve',value:27,unit:'°C',recordedAt:'2026-08-21 18:00'}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=fallback;try{const r=await fetch('/api/readings');const d=await r.json();const x=Array.isArray(d)?d:(d._embedded?Object.values(d._embedded).find(Array.isArray)||[]:[]);if(x.length)a=x}catch{}rows.innerHTML=a.map(x=>`<tr><td>${esc(x.sensorName||x.sensor)}</td><td>${esc(x.zoneName||x.zone)}</td><td>${esc(x.value||x.reading)}</td><td>${esc(x.unit)}</td><td>${esc(x.recordedAt||x.timestamp)}</td></tr>`).join('')}load();readingForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/readings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(readingForm)))}).catch(()=>{});readingForm.reset();readingForm.hidden=true;load()}</script></body></html>
